name: Zeitplan-Test

# TEMPORAER (20.10.): prueft nur, ob GitHub geplante Laeufe fuer dieses Repo zuverlaessig ausloest. Schreibt nichts, nutzt keine Secrets. Wird nach dem Test wieder geloescht.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Zeitplan-Test Ausloeser=${{ github.event_name }} UTC=$(date -u +%H:%M:%S) Berlin=$(TZ=Europe/Berlin date +%H:%M:%S)"
